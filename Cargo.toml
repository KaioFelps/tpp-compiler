[package]
name = "tpp-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
configparser = "3.3.0"
const_format = "0.2.36"
itertools = "0.15.0"
log = "0.4.34"
regex = "1.13.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

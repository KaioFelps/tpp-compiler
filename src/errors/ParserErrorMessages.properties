[ParserErrors]
WAR-SYN-GEN-SYNTAX-TREE=Generating Syntax Tree Graph.
WAR-SYN-NOT-GEN-SYNTAX-TREE=Não foi possível gerar a Árvore Sintática.
ERR-SYN-IRRECUPERAVEL=Estado irrecuperável.
WAR-SYN-ANA-SUCCESS=Análise Sintática Executada com Sucesso. Gráfico da Árvore foi gerado.
ERR-SYN-LISTA-ARGUMENTOS=Erro na lista de Argumentos.
ERR-SYN-INDICE=Erro na definicao do indice. Expressao ou indice.
ERR-SYN-EOF-INESPERADO=Final de arquivo inesperado.
WAR-SYN-OUTPUT-FILE=Output
ERR-SYN-LEIA=Uso incorreto da função 'leia'.
ERR-SYN-PARAMETRO=Declaração incorreta de parâmetro de função.
ERR-SYN-CABECALHO=Erro na declaração do cabeçalho.

; Custom errors specifics from rust impl
ERR-SYN-TARGETS-LIST-INVALIDO=Sintaxe inválida para lista de alvos. Era esperado `a, b` ou `(a, b)`. ({file}:{line}:{column})
ERR-SYN-EOF-INESPERADO-LOCALIZADO=Arquivo terminado inesperadamente próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-INVALID-VAR-DEF=Declaração de variável inválida. Uma variável deve ser iniciada com um identificador. ({file}:{tok:line}:{tok:col})
ERR-SYN-MISSING-CLOSING-BRACKET=Está faltando fechar os colchetes (`]`) próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-MISSING-CLOSING-PAREN=Está faltando fechar os parenteses (`)`) próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-MISSING-ATTRIBUTION=Está faltando a atribuição (`:=`) na inicialização das variáveis, próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-INVALID-VAR=Era esperado uma variável, mas foi encontrado '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-INVALID-TARGET-LIST=Era esperado uma lista de variáveis (`a, b` ou `(a, b)`), mas foi encontrado '{tok:value}'. ({file}:{tok:line}:{tok:col})
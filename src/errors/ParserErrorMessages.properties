[ParserErrors]
WAR-SYN-GEN-SYNTAX-TREE=Generating Syntax Tree Graph.
WAR-SYN-NOT-GEN-SYNTAX-TREE=Não foi possível gerar a Árvore Sintática.
ERR-SYN-IRRECUPERAVEL=Estado irrecuperável.
WAR-SYN-ANA-SUCCESS=Análise Sintática Executada com Sucesso. Gráfico da Árvore foi gerado.
ERR-SYN-LISTA-ARGUMENTOS=Erro na lista de Argumentos.
ERR-SYN-INDICE=Erro na definicao do indice. Expressao ou indice.
ERR-SYN-EOF-INESPERADO=Final de arquivo inesperado.
WAR-SYN-OUTPUT-FILE=Output
ERR-SYN-LEIA=Uso incorreto da função 'leia'.
ERR-SYN-PARAMETRO=Declaração incorreta de parâmetro de função.
ERR-SYN-CABECALHO=Erro na declaração do cabeçalho.

; Custom errors specifics from rust impl
ERR-SYN-TARGETS-LIST-INVALIDO=Sintaxe inválida para lista de alvos. Era esperado `a, b` ou `(a, b)`. ({file}:{line}:{column})
ERR-SYN-EOF-INESPERADO-LOCALIZADO=Arquivo terminado inesperadamente próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-INVALID-VAR-DEF=Declaração de variável inválida. Uma variável deve ser iniciada com um identificador. ({file}:{tok:line}:{tok:col})
ERR-SYN-MISSING-CLOSING-BRACKET=Está faltando fechar os colchetes (`]`) próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-MISSING-CLOSING-PAREN=Está faltando fechar os parenteses (`)`) próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-EXPECTED-CLOSING-PAREN=Esperava-se o fechamento dos parenteses (`)`), mas se encontrou '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-MISSING-ATTRIBUTION=Está faltando a atribuição (`:=`) na inicialização das variáveis, próximo a '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-EXPECTED-ATTRIBUTION=Esperava atribuição (`:=`) na inicialização das variáveis, mas encontrou '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-INVALID-VAR=Era esperado uma variável, mas foi encontrado '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VARS-INITIALIZATION-INVALID-TARGET-LIST=Era esperado uma lista de variáveis (`a, b` ou `(a, b)`), mas foi encontrado '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-MULTIPLE-RETURN-TYPES-MISSING-PAREN-OPEN=Para múltiplos retornos em uma função, você precisa utilizar uma tupla no tipo `(TipoA, TipoB)`. ({file}:{tok:line}:{tok:col})
ERR-SYN-MULTIPLE-RETURN-TYPES-EXPECTED-PAREN-CLOSE=Era esperado fechar os parênteses do retorno múltiplo (`(TipoA, TipoB)`), mas encontrou-se '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-EXPR-LIST-LEFTOVER-COMMA=Vírgula sobrando na lista de expressões ('{tok:value}'). ({file}:{tok:line}:{tok:col})
ERR-SYN-SIMPLE-EXPR-LEFTOVER-REL-OPERATOR=Operador relacional sobrando na expressão simples (`{tok:value}`). ({file}:{tok:line}:{tok:col})
ERR-SYN-SIMPLE-EXPR-LEFTOVER-ADD-OPERATOR=Operador de adição sobrando na expressão aditiva (`{tok:value}`). ({file}:{tok:line}:{tok:col})
ERR-SYN-SIMPLE-EXPR-LEFTOVER-MULT-OPERATOR=Operador de multiplicação sobrando na expressão de produo (`{tok:value}`). ({file}:{tok:line}:{tok:col})
ERR-SYN-LOGICAL-OP-INVALID=Operador lógico inválido: esperava `&&` ou `||`, mas recebeu '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-FACTOR-MISSING-PAREN-CLOSE=Faltou fechar o fator: esperava `)`, mas recebeu '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-FATOR=Fator mal-formado. ({file}:{tok:line}:{tok:col})
ERR-SYN-TUPLE-MISSING-PAREN-CLOSE=Faltou fechar a tupla: esperava `)`, mas recebeu '{tok:value}'. ({file}:{tok:line}:{tok:col}) 
ERR-SYN-ARRAY-PAREN-OPEN=Declaração de array inválida. Um array deve ter a forma `{ a, b, ..., z }`. Talvez você queira substituir '{tok:value}' por `{`. ({file}:{tok:line}:{tok:col})
ERR-SYN-ARRAY-PAREN-CLOSE=Faltou fechar o array: esperava `}`, mas encontrou '{tok:value}'. ({file}:{tok:line}:{tok:col})
ERR-SYN-VAR-ATTRIBUTION-MISSING-ATTRIBUTION=Para atribuir valores à variáveis, utilize a atribuição (`:=`). ({file}:{tok:line}:{tok:col})
ERR-SYN-ACTION-INVALID-VAR-DECL=Declaração de variável inválida encontrada. Utilize a forma `TYPE: ID` para declarar variáveis. Por exemplo: `inteiro: a`. ({file}:{tok:line}:{tok:col})
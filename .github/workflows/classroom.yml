name: GitHub Classroom Workflow

on: [push]

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências extras para o Autograding
        run: sudo pip install automata-lib configparser --break-system-packages

      - uses: education/autograding@v1
